<style>
/* Mise en page : barre « prototype » sombre en haut, puis l'écran de l'application tel qu'il sera (shell latéral, portail ou téléphone). */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunken: #eef0f3; --inverse: #151a21; --on-inverse: #f4f5f7; --on-inverse-muted: #b8bfca;
  --border: #dde1e7; --border-strong: #c3c9d2; --border-input: #7b8494;
  --text: #151a21; --muted: #545d6b;
  --accent: #2f5bea; --accent-hover: #2449c4; --accent-subtle: #e9eefd; --on-accent: #ffffff;
  --success: #1d7347; --success-subtle: #e5f4ec; --warning: #8a5300; --warning-subtle: #fff3d9;
  --danger: #c22b2b; --danger-hover: #a32020; --danger-subtle: #fdeaea; --on-danger: #ffffff;
  --info: #1b5ea6; --info-subtle: #e7f0fb; --neutral: #4a5361; --neutral-subtle: #eceef2;
  --scan-ok: #0f7a3d; --scan-error: #b42318; --on-scan: #ffffff;
  --shadow: 0 1px 2px rgba(16,24,40,.05); --pop: 0 12px 32px rgba(16,24,40,.18);
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1318; --surface: #171c23; --sunken: #1f252d; --inverse: #05070a; --on-inverse: #e8ebef; --on-inverse-muted: #9aa3b0;
  --border: #2a313b; --border-strong: #3a424e; --border-input: #6f7887; --text: #e8ebef; --muted: #a3abb7;
  --accent: #7f9cff; --accent-hover: #9cb3ff; --accent-subtle: #1c2645; --on-accent: #0b1020;
  --success: #5cc993; --success-subtle: #13291e; --warning: #e8b04a; --warning-subtle: #2e2412;
  --danger: #f27b7b; --danger-hover: #ff9797; --danger-subtle: #351a1c; --on-danger: #1a0909;
  --info: #79b4f5; --info-subtle: #142538; --neutral: #b9c0cb; --neutral-subtle: #252b34;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --pop: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #171c23; --sunken: #1f252d; --inverse: #05070a; --on-inverse: #e8ebef; --on-inverse-muted: #9aa3b0;
  --border: #2a313b; --border-strong: #3a424e; --border-input: #6f7887; --text: #e8ebef; --muted: #a3abb7;
  --accent: #7f9cff; --accent-hover: #9cb3ff; --accent-subtle: #1c2645; --on-accent: #0b1020;
  --success: #5cc993; --success-subtle: #13291e; --warning: #e8b04a; --warning-subtle: #2e2412;
  --danger: #f27b7b; --danger-hover: #ff9797; --danger-subtle: #351a1c; --on-danger: #1a0909;
  --info: #79b4f5; --info-subtle: #142538; --neutral: #b9c0cb; --neutral-subtle: #252b34;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --pop: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 20px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--inverse); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.lbl { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- barre du prototype ---- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--inverse); color: var(--on-inverse);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.proto .brand { font-weight: 800; letter-spacing: -.01em; }
.proto .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--on-inverse-muted); }
.proto label { display: flex; gap: 6px; align-items: center; color: var(--on-inverse-muted); font-size: 12px; }
.proto select { background: transparent; color: var(--on-inverse); border: 1px solid #3c4552; border-radius: var(--r-md); height: 32px; padding: 0 8px; max-width: 260px; }
.proto select option { color: #151a21; background: #fff; }
.proto .spacer { flex: 1; }
.proto button { height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid #3c4552; background: transparent; color: var(--on-inverse); cursor: pointer; font-weight: 600; font-size: 12px; }
.proto button.primary { background: var(--on-inverse); color: var(--inverse); border-color: var(--on-inverse); }
.proto .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11px; margin-left: 6px; padding: 0 5px; }

/* ---- shell de l'application ---- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100dvh - 48px); }
.side { background: var(--surface); border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.side .logo { height: 44px; display: flex; align-items: center; padding: 0 8px; font-weight: 800; font-size: 18px; }
.side .grp { margin: 10px 8px 4px; }
.nav { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-md); color: var(--text); text-decoration: none; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--sunken); }
.nav[aria-current="page"] { background: var(--accent-subtle); color: var(--accent); font-weight: 600; }
.nav svg { flex: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 52px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .who { margin-left: auto; text-align: right; line-height: 1.2; }
.top .mob-logo { display: none; }
@media (max-width: 960px) { .top .mob-logo { display: inline; } }
.top .who b { display: block; }
.mnav { display: none; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); padding: 6px; gap: 4px; }
.mnav .nav { width: auto; white-space: nowrap; height: 32px; font-size: 12px; }
.content { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 1360px; margin: 0 auto; display: grid; gap: 20px; align-content: start; }
@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .mnav { display: flex; }
}

/* ---- composants ---- */
.ph { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.ph h1 { font-size: 26px; line-height: 32px; font-weight: 700; }
.ph .sub { color: var(--muted); margin-top: 4px; }
.ph .back { font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.side-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 1100px) { .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .side-layout { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .g2, .g3, .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .g2, .g3 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.card > .bd { padding: 16px; }
.card > .bd.flush { padding: 0; }
.card.danger { border-color: var(--danger); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid transparent; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn.p { background: var(--accent); color: var(--on-accent); }
.btn.p:hover { background: var(--accent-hover); }
.btn.s { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.s:hover { background: var(--sunken); }
.btn.g { background: transparent; color: var(--text); }
.btn.g:hover { background: var(--sunken); }
.btn.d { background: var(--danger); color: var(--on-danger); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn.lg { height: 46px; padding: 0 18px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-neutral { background: var(--neutral-subtle); color: var(--neutral); }
.t-info { background: var(--info-subtle); color: var(--info); }
.t-success { background: var(--success-subtle); color: var(--success); }
.t-warning { background: var(--warning-subtle); color: var(--warning); }
.t-danger { background: var(--danger-subtle); color: var(--danger); }
.t-accent { background: var(--accent-subtle); color: var(--accent); }
.banner { border-radius: var(--r-md); padding: 10px 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi .v { font-size: 26px; line-height: 32px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.warn { border-color: var(--warning); } .kpi.warn .v { color: var(--warning); }
.kpi.bad { border-color: var(--danger); } .kpi.bad .v { color: var(--danger); }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td { padding: 0 12px; height: 40px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--bg); }
th.r, td.r { text-align: right; }
td .code { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); }
.bad-n { color: var(--danger); font-weight: 600; }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; }
.input, .select, .textarea { width: 100%; height: 36px; border: 1px solid var(--border-input); border-radius: var(--r-md); background: var(--surface); padding: 0 10px; }
.textarea { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; }
.ro { min-height: 36px; display: flex; align-items: center; padding: 6px 10px; background: var(--sunken); border-radius: var(--r-md); overflow-wrap: anywhere; }
.help { font-size: 12px; color: var(--muted); }
.err { font-size: 12px; color: var(--danger); }
.check { display: flex; align-items: center; gap: 8px; min-height: 34px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); padding: 0 12px; }
.tab { padding: 10px 12px; border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); font-weight: 600; }
.tab small { margin-left: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.filters { display: grid; gap: 10px; grid-template-columns: 2fr repeat(5, minmax(0, 1fr)); align-items: end; }
@media (max-width: 1100px) { .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .filters { grid-template-columns: 1fr 1fr; } }
.steps { display: flex; flex-wrap: wrap; gap: 6px 16px; list-style: none; padding: 0; margin: 0; }
.steps button { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--muted); }
.steps .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--border-strong); background: var(--surface); }
.steps .cur { color: var(--text); font-weight: 600; } .steps .cur .dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.steps .done .dot { background: var(--success); color: var(--on-scan); border-color: var(--success); }
.bar { height: 8px; border-radius: 99px; background: var(--accent-subtle); overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--accent); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); } .empty b { display: block; color: var(--text); margin-bottom: 4px; }
.chip { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: var(--r-sm); background: var(--sunken); }
dl.kv { display: grid; gap: 12px 24px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; }
dl.kv dd { margin: 2px 0 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { dl.kv { grid-template-columns: 1fr; } }
.scanfb { border-radius: var(--r-lg); padding: 20px; color: var(--on-scan); display: grid; gap: 4px; }
.scanfb .big { font-size: 34px; line-height: 40px; font-weight: 800; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart .grid line { stroke: var(--border); }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.list li { border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; background: var(--surface); }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--inverse); color: var(--on-inverse); padding: 10px 14px; border-radius: var(--r-md); box-shadow: var(--pop); max-width: calc(100% - 32px); }

/* ---- zones hors shell ---- */
.public { min-height: calc(100dvh - 48px); background: var(--surface); }
.pub-in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pub-nav { display: flex; align-items: center; gap: 16px; height: 64px; border-bottom: 1px solid var(--border); }
.pub-nav .links { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.pub-nav .links a { color: var(--text); text-decoration: none; font-weight: 500; }
@media (max-width: 760px) { .pub-nav .links { display: none; } }
.hero { padding-block: 64px 48px; display: grid; gap: 32px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; }
.hero h1 { font-size: 44px; line-height: 48px; font-weight: 800; letter-spacing: -.02em; }
.hero p { font-size: 17px; line-height: 27px; color: var(--muted); max-width: 56ch; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero h1 { font-size: 34px; line-height: 40px; } }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--border); }
.facts div { padding: 20px 16px; border-right: 1px solid var(--border); } .facts div:last-child { border-right: 0; }
.facts b { display: block; font-size: 28px; line-height: 34px; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .facts div:nth-child(2) { border-right: 0; } }
.sec { padding-block: 48px; display: grid; gap: 24px; } .sec h2 { font-size: 28px; line-height: 34px; font-weight: 700; }
.svc { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.svc .card .bd h3 { font-size: 16px; margin-bottom: 6px; }
@media (max-width: 860px) { .svc { grid-template-columns: 1fr; } }
.portal-top { height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--surface);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone-wrap { min-height: calc(100dvh - 48px); display: grid; place-items: start center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { width: 100%; max-width: 390px; border: 10px solid var(--inverse); border-radius: 36px; background: var(--bg); overflow: hidden; box-shadow: var(--pop); }
.phone .stat { height: 28px; background: var(--inverse); color: var(--on-inverse); font-size: 11px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.phone .pc { padding: 14px; display: grid; gap: 12px; }
.tv { min-height: calc(100dvh - 48px); background: #0b0e12; color: #e8ebef; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; align-content: start; }
.tv .big { font-size: 56px; line-height: 60px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tv .tile { border: 1px solid #2a313b; border-radius: var(--r-lg); padding: 20px; background: #12171d; }
.tv .ann { background: #2e2412; color: #f6c26b; border-radius: var(--r-lg); padding: 16px 20px; font-size: 20px; line-height: 28px; }

/* ---- remarques du client ---- */
.fb-btn { position: fixed; z-index: 25; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); height: 44px; padding: 0 16px; border-radius: 99px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; box-shadow: var(--pop); cursor: pointer; }
.drawer { position: fixed; z-index: 35; inset: 0 0 0 auto; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--pop); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.drawer .db { padding: 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.opts { display: grid; gap: 6px; }
.opts label { display: flex; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 10px; cursor: pointer; }

.scrim { position: fixed; inset: 0; z-index: 34; background: rgba(0,0,0,.35); }

.index-grp .items { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

.index-item .s { font-family: var(--mono); font-size: 11px; color: var(--muted); }
</style>

  <span class="spacer"></span>

</div>

<script>
"use strict";
// ======================================================================= données fictives

function barChart(items, { w = 520, h = 200, max, fmt = (v) => n(v), color = "var(--accent)" } = {}) {
  const top = max ?? Math.max(...items.map((i) => i[1]));
  const padL = 44, padB = 26, innerW = w - padL - 8, innerH = h - padB - 10, bw = innerW / items.length;
  const ticks = [0, 0.5, 1].map((t) => t * top);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Graphique">
    <g class="grid">${ticks.map((t) => { const y = 10 + innerH - (t / top) * innerH; return `<line x1="${padL}" x2="${w - 8}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${fmt(t)}</text>`; }).join("")}</g>
    ${items.map(([label, v], i) => { const bh = (v / top) * innerH; const x = padL + i * bw + bw * 0.18; return `<rect x="${x}" y="${10 + innerH - bh}" width="${bw * 0.64}" height="${bh}" rx="3" fill="${color}"><title>${label} : ${fmt(v)}</title></rect><text x="${x + bw * 0.32}" y="${h - 8}" text-anchor="middle">${label}</text>`; }).join("")}
  </svg>`;
}

const SIDE_GROUPS = ["Pilotage", "Missions", "Terrain", "Équipes", "Administration", "Finance", "Plateforme"];
function shell(inner) {
  const role = ROLES[state.role];
  const items = SCREENS.filter((s) => s[4].includes(state.role) && s[0] !== "sommaire" && !["ecran-tv", "mission", "rapport", "scan-4s", "import"].includes(s[0]));
  const navItem = (s) => `<button class="nav" data-go="${s[0]}" ${state.view === s[0] || (s[0] === "missions" && ["mission", "rapport", "scan-4s", "import"].includes(state.view)) ? 'aria-current="page"' : ""}>${icon(I[s[5]])}${s[1].replace(" (6 étapes)", "")}</button>`;
  return `<div class="shell"><aside class="side" aria-label="Navigation"><div class="logo">qc-ops</div>
      ${SIDE_GROUPS.map((g) => { const its = items.filter((s) => s[3] === g); return its.length ? `<div class="grp lbl">${g}</div>${its.map(navItem).join("")}` : ""; }).join("")}</aside>
    <div class="main"><div class="top"><b class="mob-logo">qc-ops</b><div class="who"><b>${role.who[0]}</b><span class="muted" style="font-size:12px">${role.who[1]}</span></div><button class="btn g sm" data-go="connexion">Sortir</button></div>
      <nav class="mnav" aria-label="Navigation">${items.map(navItem).join("")}</nav>
      <main class="content" id="contenu">${inner}</main></div></div>`;
}
function render() {
  const key = V[state.view] ? state.view : "sommaire";
  const role = ROLES[state.role];
  let html;
  const inner = V[key]();
  if (key === "sommaire") html = `<main class="content" id="contenu">${inner}</main>`;
  else if (["accueil", "demande"].includes(key)) html = `<main class="public">${inner}</main>`;
  else if (["connexion", "om-client"].includes(key)) html = `<main style="background:var(--bg)">${inner}</main>`;
  else if (key === "ecran-tv") html = `<main class="tv">${inner}</main>`;
  else if (role.area === "mobile") html = `<main class="phone-wrap">${inner}</main>`;
  else if (role.area === "portal") html = `<div class="portal-top"><b>qc-ops <span class="muted" style="font-weight:400">· portail</span></b><div style="margin-left:auto;text-align:right;line-height:1.2"><b style="display:block">${role.who[0]}</b><span class="muted" style="font-size:12px">${role.who[1]}</span></div><button class="btn g sm" data-go="connexion">Sortir</button></div><main class="content" id="contenu">${inner}</main>`;
  else html = shell(inner);
  $("#app").innerHTML = html;
  $("#roleSel").value = state.role;
  $("#screenSel").value = key;
  document.title = `${byKey[key][1]} · qc-ops Prototype`;
  $("#fbBtn").hidden = false;
}
function navigate(view, { keepRole } = {}) {
  const s = byKey[view];
  if (!s) return;
  if (!keepRole && !s[4].includes(state.role)) state.role = s[4][0];
  state.view = view;
  if (view !== "nouvelle") state.wizard = 0;
  try { history.replaceState(null, "", `#${view}`); } catch {}
  render();
  window.scrollTo({ top: 0 });
  $("#contenu")?.focus?.({ preventScroll: true });
}
function homeOf(role) {
  return { cs: "tableau-cs", ce: "tableau-ce", op: "operateur", client: "portail", visitor: "accueil" }[role];
}
function toast(msg) {
  const r = $("#toastRoot");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (r.innerHTML = ""), 3200);
}

// ======================================================================= interactions
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-step],[data-tab],[data-toast],[data-close],[data-undo],[data-offline]");
  if (!t) return;
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.dataset.go) return navigate(t.dataset.go);
  if (t.dataset.step != null) { state.wizard = Number(t.dataset.step); return render(); }
  if (t.dataset.tab) { state.tab = t.dataset.tab; return render(); }
  if (t.hasAttribute("data-close")) { state.closed = true; toast("Mission clôturée, facture brouillon créée (prototype)."); return render(); }
  if (t.hasAttribute("data-undo")) {
    const removed = state.scans.shift();
    state.last = { ok: true, title: "Saisie annulée", code: removed ? removed.code : "", detail: "Carton retiré de la mission" };
    return render();
  }
  if (t.hasAttribute("data-offline")) { state.offline = !state.offline; if (!state.offline) toast("Réseau revenu : 2 cartons envoyés (prototype)."); return render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("tr[data-go]")) navigate(e.target.dataset.go);
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-closecode]")) {
    state.closeTyped = e.target.value;
    const ok = state.closeTyped.trim().toLowerCase() === MISSIONS[0].code;
    const b = $("[data-close]"); if (b) b.disabled = !ok;
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.fake) { toast(f.dataset.fake); return navigate("accueil"); }
  if (f.hasAttribute("data-login")) {
    const id = $("#l1").value.trim();
    const role = id.includes("@") ? "client" : id === "1001" ? "ce" : id.startsWith("2") ? "op" : "cs";
    state.role = role; return navigate(homeOf(role));
  }
  if (f.hasAttribute("data-unlock")) {
    if ($("#pw").value.trim().toLowerCase() === "demo") { state.omUnlocked = true; state.omErr = false; }
    else { state.omErr = true; state.omTries = Math.min(4, (state.omTries || 0) + 1); }
    return render();
  }
  if (f.hasAttribute("data-decide")) { state.omDone = f.querySelector("input[name=dec]:checked").value; return render(); }
  if (f.hasAttribute("data-scan")) {
    const raw = $("#code").value.trim().toUpperCase();
    const q = $("#q1").value, nok = $("#q2").value;
    const at = new Date().toLocaleTimeString("fr-FR");
    let r;
    if (!raw) return;
    if (!raw.startsWith("3S")) r = { ok: false, title: "Refusé", code: raw, detail: "Ce n'est pas une étiquette 3S" };
    else if (!(Number(q) > 0)) r = { ok: false, title: "Refusé", code: raw, detail: "Indiquez la quantité contrôlée" };
    else if (state.scans.some((x) => x.code === raw)) r = { ok: false, title: "Carton déjà scanné", code: raw, detail: `Déjà scanné à ${state.scans.find((x) => x.code === raw).at}` };
    else { r = { ok: true, title: "Carton accepté", code: raw, detail: `${n(Number(q))} pcs · NOK ${nok}`, q: n(Number(q)), nok, at }; state.scans.unshift(r); }
    state.last = r;
    render();
    $("#code")?.focus();
  }
});
$("#roleSel").innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${r.label}</option>`).join("");
$("#roleSel").addEventListener("change", (e) => { state.role = e.target.value; navigate(homeOf(state.role), { keepRole: true }); });
$("#screenSel").innerHTML = [...new Set(SCREENS.map((s) => s[3]))].map((g) => `<optgroup label="${g}">${SCREENS.filter((s) => s[3] === g).map((s) => `<option value="${s[0]}">${s[2] ? s[2] + " · " : ""}${s[1]}</option>`).join("")}</optgroup>`).join("");
$("#screenSel").addEventListener("change", (e) => navigate(e.target.value));
$("#openIndex").addEventListener("click", () => navigate("sommaire"));

// ======================================================================= remarques du client
// Toujours gardées dans ce navigateur ; aussi envoyées au stockage partagé quand la personne connectée peut écrire.
const FB_KEY = "qcops-proto-feedback";
let feedback = [];
try { feedback = JSON.parse(localStorage.getItem(FB_KEY) || "[]"); } catch { feedback = []; }
let db = null;
const saveLocal = () => { try { localStorage.setItem(FB_KEY, JSON.stringify(feedback)); } catch {} };
const updateCount = () => { $("#fbCount").textContent = feedback.length; };
updateCount();
(async () => { try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; } })();

function closeDrawer() { $("#drawerRoot").innerHTML = ""; $("#fbBtn").focus(); }
function openDrawer(kind) {
  const s = byKey[state.view];
  const body = kind === "mine" ? mineBody() : `
    <p style="margin:0">Écran : <b>${s[2] ? s[2] + " · " : ""}${s[1]}</b></p>
    <form id="fbForm" style="display:grid;gap:14px">
      <fieldset class="opts" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:6px">Votre avis</legend>
        <label><input type="radio" name="fbc" value="Ça me convient" checked> Ça me convient</label>
        <label><input type="radio" name="fbc" value="À modifier"> À modifier</label>
        <label><input type="radio" name="fbc" value="Il manque quelque chose"> Il manque quelque chose</label>
        <label><input type="radio" name="fbc" value="Pas utile pour nous"> Pas utile pour nous</label></fieldset>
      <div class="field"><label class="lbl" for="fbText">Votre remarque</label><textarea class="textarea" id="fbText" placeholder="Ex. : je veux voir le PPM par opérateur sur ce rapport."></textarea></div>
      <div class="field"><label class="lbl" for="fbName">Votre nom (facultatif)</label><input class="input" id="fbName" autocomplete="name"></div>
      <button class="btn p" type="submit">Enregistrer ma remarque</button>
      <p class="help" style="margin:0">Vos remarques restent dans ce navigateur. Utilisez « Mes remarques » puis « Copier » pour les envoyer à votre interlocuteur.</p>
    </form>`;
  $("#drawerRoot").innerHTML = `<div class="scrim" data-x></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dh"><h2 id="dt" style="font-size:16px">${kind === "mine" ? "Mes remarques" : "Donner mon avis"}</h2><button class="btn g sm" data-x>Fermer</button></div><div class="db">${body}</div></aside>`;
  $("#drawerRoot").querySelectorAll("[data-x]").forEach((b) => b.addEventListener("click", closeDrawer));
  ($("#fbText") || $("#copyAll") || $(".drawer button"))?.focus();
  $("#fbForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    e.stopPropagation();
    const item = { screen: `${s[2] ? s[2] + " · " : ""}${s[1]}`, view: s[0], choice: $("input[name=fbc]:checked").value, text: $("#fbText").value.trim(), name: $("#fbName").value.trim(), at: new Date().toISOString(), shared: false };
    if (!item.text && item.choice === "Ça me convient") item.text = "";
    if (db) {
      try { await db.collection("feedback").add({ screen: item.screen, view: item.view, choice: item.choice, text: item.text.slice(0, 4000), name: item.name.slice(0, 120), at: item.at }); item.shared = true; } catch { item.shared = false; }
    }
    feedback.push(item); saveLocal(); updateCount(); closeDrawer();
    toast(item.shared ? "Remarque enregistrée et transmise à l'équipe." : "Remarque enregistrée dans ce navigateur. Pensez à copier vos remarques.");
  });
  $("#copyAll")?.addEventListener("click", async () => {
    const text = $("#allText").value;
    try { await navigator.clipboard.writeText(text); toast("Remarques copiées : collez-les dans un email ou un message."); }
    catch { $("#allText").select(); toast("Sélectionnées : faites Ctrl+C (ou Cmd+C) pour copier."); }
  });
  $("#clearAll")?.addEventListener("click", () => {
    if ($("#clearAll").dataset.armed) { feedback = []; saveLocal(); updateCount(); openDrawer("mine"); toast("Remarques effacées de ce navigateur."); }
    else { $("#clearAll").dataset.armed = "1"; $("#clearAll").textContent = "Confirmer l'effacement"; }
  });
}
function mineBody() {
  if (!feedback.length) return `<div class="empty"><b>Aucune remarque pour l'instant.</b>Ouvrez un écran puis cliquez sur « Donner mon avis sur cet écran ».</div>`;
  const text = feedback.map((f, i) => `${i + 1}. [${f.screen}] ${f.choice}${f.text ? ` : ${f.text}` : ""}${f.name ? ` (${f.name})` : ""}`).join("\n");
  return `<ul class="list">${feedback.map((f) => `<li><div class="row" style="justify-content:space-between"><b>${esc(f.screen)}</b>${pill(f.choice, f.choice === "Ça me convient" ? "success" : f.choice === "Pas utile pour nous" ? "neutral" : "warning")}</div>${f.text ? `<p style="margin:6px 0 0">${esc(f.text)}</p>` : ""}<p class="help" style="margin:4px 0 0">${f.shared ? "Transmise à l'équipe" : "Gardée dans ce navigateur"}</p></li>`).join("")}</ul>
    <div class="field"><label class="lbl" for="allText">Texte à envoyer</label><textarea class="textarea" id="allText" readonly style="min-height:140px">${esc(text)}</textarea></div>
    <div class="row"><button class="btn p" id="copyAll" type="button">Copier toutes mes remarques</button><button class="btn g" id="clearAll" type="button">Effacer</button></div>`;
}
$("#fbBtn").addEventListener("click", () => openDrawer("one"));
$("#openMine").addEventListener("click", () => openDrawer("mine"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#drawerRoot").innerHTML) closeDrawer(); });

// ======================================================================= démarrage
const start = location.hash.replace("#", "");
navigate(byKey[start] ? start : "sommaire");
</script>
